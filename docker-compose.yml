services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gotg-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD is required. Copy .env.example to .env and set SA_PASSWORD.}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mssql_data:/var/opt/mssql

  web:
    build:
      context: .
      dockerfile: GiftOfTheGivers/Dockerfile
    container_name: gotg-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=GiftOfTheGiversDb;User Id=sa;Password=${SA_PASSWORD:?SA_PASSWORD is required. Copy .env.example to .env and set SA_PASSWORD.};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "8080:8080"

volumes:
  mssql_data:
