name: Publish Helpers Package to Azure Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "helpers-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "NuGet package version (for manual runs)"
        required: false
        type: string

permissions:
  contents: read

env:
  AZURE_ARTIFACTS_NUGET_URL: "https://pkgs.dev.azure.com/ST10438928/663d5a52-1332-4463-92cb-b12591f7fde0/_packaging/giftgivers-helpers/nuget/v3/index.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        shell: bash
        env:
          # Passed via env (not ${{ }} interpolation) so input text can never become shell code.
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            resolved="${GITHUB_REF_NAME#helpers-v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            resolved="$INPUT_VERSION"
          else
            resolved="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$resolved" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$resolved' is not a valid SemVer package version"
            exit 1
          fi

          echo "package_version=$resolved" >> "$GITHUB_OUTPUT"

      - name: Check publish credentials
        id: publish-credentials
        shell: bash
        env:
          AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
        run: |
          set -euo pipefail



      - name: Test helpers before publishing
        run: dotnet test GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj --configuration Release --filter "FullyQualifiedName~HelperCalculationsTests"

      - name: Pack GiftOfTheGivers.Helpers
        if: steps.publish-credentials.outputs.can_publish == 'true'
        run: |
          dotnet pack ./GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj \
            --configuration Release \
            --output ./artifacts/nuget \
            -p:PackageVersion=${{ steps.version.outputs.package_version }}


        run: |
          dotnet nuget update source "giftgivers-helpers" \
            --source "$AZURE_ARTIFACTS_NUGET_URL" \
            --username "github-actions" \
            --password "$AZURE_ARTIFACTS_PAT" \
            --store-password-in-clear-text

      - name: Push package
        if: steps.publish-credentials.outputs.can_publish == 'true'
        run: |
          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --source "giftgivers-helpers" \
            --api-key "AzureArtifacts" \
            --skip-duplicate
