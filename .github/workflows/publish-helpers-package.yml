name: Publish Helpers Package to Azure Artifacts

on:
  push:
    tags:
      - "helpers-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "NuGet package version (for manual runs)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            resolved="${GITHUB_REF_NAME#helpers-v}"
          elif [[ -n "${{ inputs.package_version }}" ]]; then
            resolved="${{ inputs.package_version }}"
          else
            resolved="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "package_version=$resolved" >> "$GITHUB_OUTPUT"

      - name: Pack GiftOfTheGivers.Helpers
        run: |
          dotnet pack ./GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj \
            --configuration Release \
            --output ./artifacts/nuget \
            -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Add Azure Artifacts source
        run: |
          dotnet nuget add source "${{ secrets.AZURE_ARTIFACTS_NUGET_URL }}" \
            --name "azure-artifacts" \
            --username "github-actions" \
            --password "${{ secrets.AZURE_ARTIFACTS_PAT }}" \
            --store-password-in-clear-text

      - name: Push package
        run: |
          dotnet nuget push "./artifacts/nuget/*.nupkg" \
            --source "azure-artifacts" \
            --skip-duplicate
