trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.401

  - task: Cache@2
    displayName: Cache NuGet packages
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json, **/*.csproj'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(NUGET_PACKAGES)
    env:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages

  - script: dotnet restore GiftOfTheGivers.slnx
    displayName: Restore dependencies

  - script: dotnet build GiftOfTheGivers.slnx --configuration $(buildConfiguration) --no-restore
    displayName: Build solution

  - script: >
      dotnet test GiftOfTheGivers.slnx
      --configuration $(buildConfiguration)
      --no-build
      --logger "trx;LogFileName=test-results.trx"
      --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Run tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: "**/*.trx"
      searchFolder: $(Agent.TempDirectory)/TestResults
      mergeTestResults: true
      failTaskOnFailedTests: true

  - script: |
      set -e
      dotnet list GiftOfTheGivers.slnx package --vulnerable --include-transitive | tee vulnerable-packages.log
      if grep -q "has the following vulnerable packages" vulnerable-packages.log; then
        echo "##vso[task.logissue type=error]Vulnerable NuGet packages detected."
        exit 1
      fi
    displayName: Check vulnerable packages
