<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
  <title>System architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3C4655"/></marker>
    <style>
      .box{fill:#fff;stroke:#155E9E;stroke-width:1.5;rx:8}
      .ext{fill:#FDF1E7;stroke:#E8833A;stroke-width:1.5}
      .data{fill:#E7F0F8;stroke:#0F4676;stroke-width:1.5}
      .grp{fill:#F6F8FB;stroke:#BBD6EA;stroke-width:1.2;stroke-dasharray:5 4}
      .t{fill:#1B2430;font-weight:600}
      .s{fill:#3C4655;font-size:11.5px}
      .l{stroke:#3C4655;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .ld{stroke:#3C4655;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .lbl{fill:#6B7684;font-size:11px}
    </style>
  </defs>

  <!-- Users -->
  <rect x="20" y="40" width="150" height="96" rx="8" class="box"/>
  <text x="95" y="66" text-anchor="middle" class="t">Browser</text>
  <text x="95" y="86" text-anchor="middle" class="s">Public visitor</text>
  <text x="95" y="102" text-anchor="middle" class="s">Donor (role)</text>
  <text x="95" y="118" text-anchor="middle" class="s">Employee (role)</text>

  <!-- Web app group -->
  <rect x="220" y="20" width="420" height="380" rx="12" class="grp"/>
  <text x="236" y="42" class="t">GiftOfTheGivers web app · ASP.NET Core MVC (.NET 10)</text>

  <rect x="240" y="58" width="180" height="104" rx="8" class="box"/>
  <text x="330" y="80" text-anchor="middle" class="t">Controllers / Pages</text>
  <text x="330" y="99" text-anchor="middle" class="s">Home · Donor · Employee</text>
  <text x="330" y="115" text-anchor="middle" class="s">Payments (ITN webhook)</text>
  <text x="330" y="131" text-anchor="middle" class="s">Identity (Register/Login)</text>
  <text x="330" y="147" text-anchor="middle" class="s">ImpactStats view component</text>

  <rect x="440" y="58" width="180" height="104" rx="8" class="box"/>
  <text x="530" y="80" text-anchor="middle" class="t">Cross-cutting</text>
  <text x="530" y="99" text-anchor="middle" class="s">Rate limiter (POST/IP)</text>
  <text x="530" y="115" text-anchor="middle" class="s">Security headers · CSP</text>
  <text x="530" y="131" text-anchor="middle" class="s">Anti-forgery · AuthZ roles</text>
  <text x="530" y="147" text-anchor="middle" class="s">Serilog request logging</text>

  <rect x="240" y="182" width="380" height="96" rx="8" class="box"/>
  <text x="430" y="204" text-anchor="middle" class="t">Services</text>
  <text x="430" y="224" text-anchor="middle" class="s">DonationService (capture · verify payment · recalculate funding)</text>
  <text x="430" y="240" text-anchor="middle" class="s">PayFastPaymentService · CurrencyConverter · AuditService</text>
  <text x="430" y="256" text-anchor="middle" class="s">SendGrid / NoOp email · IdentityEmailSender · TaxCertificatePdf</text>

  <rect x="240" y="298" width="380" height="84" rx="8" class="box"/>
  <text x="430" y="320" text-anchor="middle" class="t">ApplicationDbContext (EF Core 10)</text>
  <text x="430" y="340" text-anchor="middle" class="s">Identity · Projects · Donations · Volunteers · Assignments</text>
  <text x="430" y="356" text-anchor="middle" class="s">Updates · Inquiries · AuditLogs · DataProtectionKeys</text>
  <text x="430" y="372" text-anchor="middle" class="s">DbSeeder (roles, bootstrap staff, dev demo data)</text>

  <!-- Data -->
  <rect x="250" y="450" width="360" height="70" rx="8" class="data"/>
  <text x="430" y="478" text-anchor="middle" class="t">SQL Server / Azure SQL</text>
  <text x="430" y="498" text-anchor="middle" class="s">LocalDB (dev) · Docker SQL 2022 · Azure SQL (hosted)</text>

  <!-- External -->
  <rect x="700" y="40" width="240" height="78" rx="8" class="ext"/>
  <text x="820" y="66" text-anchor="middle" class="t">PayFast</text>
  <text x="820" y="86" text-anchor="middle" class="s">Hosted checkout (redirect)</text>
  <text x="820" y="102" text-anchor="middle" class="s">ITN callback · /query/validate</text>

  <rect x="700" y="150" width="240" height="60" rx="8" class="ext"/>
  <text x="820" y="176" text-anchor="middle" class="t">SendGrid (optional)</text>
  <text x="820" y="194" text-anchor="middle" class="s">Receipts, status, identity emails</text>

  <rect x="700" y="240" width="240" height="60" rx="8" class="ext"/>
  <text x="820" y="266" text-anchor="middle" class="t">Google Fonts · jsDelivr</text>
  <text x="820" y="284" text-anchor="middle" class="s">Inter font · Bootstrap Icons (SRI)</text>

  <rect x="700" y="330" width="240" height="78" rx="8" class="box"/>
  <text x="820" y="356" text-anchor="middle" class="t">Azure Function (isolated)</text>
  <text x="820" y="376" text-anchor="middle" class="s">GET /api/tax-certificate/{reference}</text>
  <text x="820" y="392" text-anchor="middle" class="s">Function key · verified donations only</text>

  <rect x="700" y="450" width="240" height="70" rx="8" class="box"/>
  <text x="820" y="476" text-anchor="middle" class="t">GiftOfTheGivers.Helpers</text>
  <text x="820" y="496" text-anchor="middle" class="s">Calculations (NuGet package)</text>

  <!-- Arrows -->
  <path d="M170,88 L238,100" class="l"/>
  <text x="178" y="80" class="lbl">HTTPS, cookies</text>
  <path d="M330,162 L330,180" class="l"/>
  <path d="M430,278 L430,296" class="l"/>
  <path d="M430,382 L430,448" class="l"/>
  <path d="M620,205 L698,90" class="l"/>
  <text x="628" y="150" class="lbl">validate ITN</text>
  <path d="M698,108 L622,118" class="ld"/>
  <text x="626" y="132" class="lbl">ITN POST</text>
  <path d="M620,230 L698,180" class="l"/>
  <path d="M95,136 C95,230 640,40 698,70" class="ld"/>
  <text x="120" y="190" class="lbl">redirect to pay (rand)</text>
  <path d="M170,120 C400,10 650,230 698,270" class="ld" opacity="0.55"/>
  <path d="M700,400 C650,430 640,470 612,480" class="l"/>
  <text x="634" y="430" class="lbl">EF Core</text>
  <path d="M620,330 C660,330 660,490 698,490" class="ld"/>
  <text x="646" y="452" class="lbl" transform="rotate(0)">project ref</text>
</svg>
