<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">
  <title>Audit programme lifecycle</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#155E9E"/></marker>
    <style>
      .st{fill:#fff;stroke:#155E9E;stroke-width:1.6}
      .hl{fill:#155E9E}
      .t{fill:#1B2430;font-weight:700;font-size:13px}.d{fill:#3C4655;font-size:11px}.w{fill:#fff;font-weight:700}
      .l{stroke:#155E9E;stroke-width:2;fill:none;marker-end:url(#a)}
      .reg{fill:#FDF1E7;stroke:#E8833A;stroke-width:1.6}
    </style>
  </defs>
  <rect x="370" y="150" width="220" height="100" rx="12" class="reg"/>
  <text x="480" y="176" text-anchor="middle" class="t">Findings register</text>
  <text x="480" y="196" text-anchor="middle" class="d">docs/audits/findings-register.json</text>
  <text x="480" y="214" text-anchor="middle" class="d">stable IDs F-01…F-nn</text>
  <text x="480" y="232" text-anchor="middle" class="d">status history per audit</text>

  <rect x="40" y="30" width="200" height="90" rx="10" class="st"/><rect x="40" y="30" width="200" height="26" rx="10" class="hl"/>
  <text x="140" y="48" text-anchor="middle" class="w">1 · Baseline audit</text>
  <text x="52" y="76" class="d">Evidence-based review of the</text><text x="52" y="92" class="d">whole system; scorecard; risk</text><text x="52" y="108" class="d">register (AUD-YYYY-MM-NN)</text>

  <rect x="380" y="20" width="200" height="90" rx="10" class="st"/><rect x="380" y="20" width="200" height="26" rx="10" class="hl"/>
  <text x="480" y="38" text-anchor="middle" class="w">2 · Remediate</text>
  <text x="392" y="66" class="d">Fix by priority (P0→P3); each</text><text x="392" y="82" class="d">PR cites finding IDs and adds a</text><text x="392" y="98" class="d">regression test</text>

  <rect x="720" y="30" width="200" height="90" rx="10" class="st"/><rect x="720" y="30" width="200" height="26" rx="10" class="hl"/>
  <text x="820" y="48" text-anchor="middle" class="w">3 · Verify</text>
  <text x="732" y="76" class="d">Re-run tests, migrations on SQL</text><text x="732" y="92" class="d">Server, smoke test; record the</text><text x="732" y="108" class="d">evidence per finding</text>

  <rect x="720" y="280" width="200" height="90" rx="10" class="st"/><rect x="720" y="280" width="200" height="26" rx="10" class="hl"/>
  <text x="820" y="298" text-anchor="middle" class="w">4 · Addendum</text>
  <text x="732" y="326" class="d">What changed, status per finding,</text><text x="732" y="342" class="d">new findings, re-scored</text><text x="732" y="358" class="d">scorecard (before → after)</text>

  <rect x="380" y="290" width="200" height="90" rx="10" class="st"/><rect x="380" y="290" width="200" height="26" rx="10" class="hl"/>
  <text x="480" y="308" text-anchor="middle" class="w">5 · Monitor</text>
  <text x="392" y="336" class="d">CI gates keep fixed issues fixed:</text><text x="392" y="352" class="d">tests, vuln audit, EF drift,</text><text x="392" y="368" class="d">migrations on SQL Server</text>

  <rect x="40" y="280" width="200" height="90" rx="10" class="st"/><rect x="40" y="280" width="200" height="26" rx="10" class="hl"/>
  <text x="140" y="298" text-anchor="middle" class="w">6 · Next audit</text>
  <text x="52" y="326" class="d">Quarterly or before each major</text><text x="52" y="342" class="d">release; starts from the register</text><text x="52" y="358" class="d">and the open items list</text>

  <path d="M240,70 L378,66" class="l"/>
  <path d="M580,66 L718,70" class="l"/>
  <path d="M820,120 L820,278" class="l"/>
  <path d="M720,330 L582,334" class="l"/>
  <path d="M380,334 L242,328" class="l"/>
  <path d="M140,280 L140,122" class="l"/>
  <path d="M480,110 L480,148" class="l" stroke-dasharray="4 3"/>
  <path d="M720,110 L592,170" class="l" stroke-dasharray="4 3"/>
  <path d="M590,240 L720,300" class="l" stroke-dasharray="4 3"/>
  <path d="M370,200 L242,110" class="l" stroke-dasharray="4 3"/>
</svg>
