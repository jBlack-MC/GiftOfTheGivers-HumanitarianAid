<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">
  <title>Entity relationship diagram</title>
  <defs>
    <style>
      .tb{fill:#fff;stroke:#155E9E;stroke-width:1.4}
      .hd{fill:#155E9E}
      .hn{fill:#fff;font-weight:700;font-size:12.5px}
      .c{fill:#1B2430}.k{fill:#0F4676;font-weight:700}.f{fill:#C96A25;font-weight:600}.g{fill:#6B7684}
      .rel{stroke:#3C4655;stroke-width:1.3;fill:none}
      .lbl{fill:#6B7684;font-size:10.5px}
    </style>
  </defs>
  <!-- AspNetUsers -->
  <rect x="380" y="20" width="220" height="118" class="tb"/><rect x="380" y="20" width="220" height="24" class="hd"/>
  <text x="390" y="37" class="hn">AspNetUsers (AppUser)</text>
  <text x="390" y="60" class="k">PK Id nvarchar(450)</text>
  <text x="390" y="76" class="c">Email, UserName, PasswordHash</text>
  <text x="390" y="92" class="c">FullName nvarchar(150)</text>
  <text x="390" y="108" class="c">DateRegistered datetime2</text>
  <text x="390" y="124" class="g">+ Roles: Donor, Employee (AspNetUserRoles)</text>

  <!-- ReliefProjects -->
  <rect x="20" y="200" width="260" height="196" class="tb"/><rect x="20" y="200" width="260" height="24" class="hd"/>
  <text x="30" y="217" class="hn">ReliefProjects</text>
  <text x="30" y="240" class="k">PK Id int</text>
  <text x="30" y="256" class="f">FK CreatedByUserId → Users (Restrict)</text>
  <text x="30" y="272" class="c">Title(200), Description, Location(100)</text>
  <text x="30" y="288" class="c">StartDate, EndDate  CK End ≥ Start</text>
  <text x="30" y="304" class="c">Status  CK Active|Completed|Suspended</text>
  <text x="30" y="320" class="c">FundsRequired dec(18,2) CK ≥ 0</text>
  <text x="30" y="336" class="c">OfflineFundsZar dec(18,2) CK ≥ 0</text>
  <text x="30" y="352" class="c">FundsRaised dec(18,2) (= offline + verified)</text>
  <text x="30" y="368" class="c">ImageUrl, CreatedDate</text>
  <text x="30" y="384" class="c">RowVersion rowversion (concurrency)</text>

  <!-- Donations -->
  <rect x="360" y="200" width="270" height="276" class="tb"/><rect x="360" y="200" width="270" height="24" class="hd"/>
  <text x="370" y="217" class="hn">Donations</text>
  <text x="370" y="240" class="k">PK Id int</text>
  <text x="370" y="256" class="f">FK DonorId → Users (SetNull, nullable)</text>
  <text x="370" y="272" class="f">FK ReliefProjectId → Projects (Restrict, null)</text>
  <text x="370" y="288" class="c">DonationType CK OneTime|Recurring</text>
  <text x="370" y="304" class="c">Currency CK ZAR|USD|EUR · Amount CK &gt; 0</text>
  <text x="370" y="320" class="c">AmountZar CK &gt; 0 · ExchangeRateToZar CK &gt; 0</text>
  <text x="370" y="336" class="c">PaymentMethod CK Card|EFT|Cash</text>
  <text x="370" y="352" class="c">PaymentStatus 0 Pending|1 Verified|2 Failed</text>
  <text x="370" y="368" class="c">PaymentVerifiedAt, ProviderPaymentId(50)</text>
  <text x="370" y="384" class="k">UK IdempotencyKey · UK TransactionReference</text>
  <text x="370" y="400" class="c">DonorName(100), DonorEmail(200), Notes(500)</text>
  <text x="370" y="416" class="c">IsAnonymous, TaxCertificateIssued</text>
  <text x="370" y="432" class="c">DonationDate, PrivacyConsentAt</text>
  <text x="370" y="448" class="g">IX (DonorId, DonationDate)</text>
  <text x="370" y="464" class="g">IX (PaymentStatus, DonationDate)</text>

  <!-- Volunteers -->
  <rect x="710" y="200" width="250" height="196" class="tb"/><rect x="710" y="200" width="250" height="24" class="hd"/>
  <text x="720" y="217" class="hn">Volunteers</text>
  <text x="720" y="240" class="k">PK Id int</text>
  <text x="720" y="256" class="f">FK UserId → Users (SetNull, nullable)</text>
  <text x="720" y="272" class="c">FirstName, LastName, Email(200)</text>
  <text x="720" y="288" class="c">PhoneNumber(20)?, DateOfBirth?</text>
  <text x="720" y="304" class="c">Address, City, Province, PostalCode</text>
  <text x="720" y="320" class="c">Skills, Availability</text>
  <text x="720" y="336" class="c">EmergencyContactName(200)?, Phone(20)?</text>
  <text x="720" y="352" class="c">Status CK Pending|Approved|Rejected</text>
  <text x="720" y="368" class="c">ApplicationDate, ApprovalDate, Notes</text>
  <text x="720" y="384" class="c">PrivacyConsentAt</text>

  <!-- ProjectUpdates -->
  <rect x="20" y="460" width="260" height="110" class="tb"/><rect x="20" y="460" width="260" height="24" class="hd"/>
  <text x="30" y="477" class="hn">ProjectUpdates</text>
  <text x="30" y="500" class="k">PK Id int</text>
  <text x="30" y="516" class="f">FK ReliefProjectId → Projects (Restrict)</text>
  <text x="30" y="532" class="f">FK PostedByUserId → Users (Restrict)</text>
  <text x="30" y="548" class="c">Title(200), Content, ImageUrl</text>
  <text x="30" y="564" class="c">CreatedBy, CreatedDate, LastModifiedDate</text>

  <!-- VolunteerAssignments -->
  <rect x="710" y="460" width="250" height="96" class="tb"/><rect x="710" y="460" width="250" height="24" class="hd"/>
  <text x="720" y="477" class="hn">VolunteerAssignments</text>
  <text x="720" y="500" class="k">PK Id · UK (VolunteerId, ReliefProjectId)</text>
  <text x="720" y="516" class="f">FK VolunteerId → Volunteers (Cascade)</text>
  <text x="720" y="532" class="f">FK ReliefProjectId → Projects (Restrict)</text>
  <text x="720" y="548" class="c">AssignedDate</text>

  <!-- Standalone -->
  <rect x="360" y="510" width="270" height="110" class="tb"/><rect x="360" y="510" width="270" height="24" class="hd"/>
  <text x="370" y="527" class="hn">Standalone tables</text>
  <text x="370" y="550" class="c">AuditLogs: UserId(450), Action(100),</text>
  <text x="370" y="566" class="c">  TargetEntity(100), TargetId, Details(1000), Timestamp</text>
  <text x="370" y="582" class="c">Inquiries: Name, Email, Subject, Message(4000),</text>
  <text x="370" y="598" class="c">  SubmittedDate, Handled, PrivacyConsentAt</text>
  <text x="370" y="614" class="c">DataProtectionKeys: FriendlyName, Xml</text>

  <!-- Relationships -->
  <path d="M380,90 C200,90 150,150 150,198" class="rel"/><text x="200" y="104" class="lbl">1 — * created</text>
  <path d="M490,138 L490,198" class="rel"/><text x="496" y="172" class="lbl">1 — * donor</text>
  <path d="M600,90 C780,90 835,150 835,198" class="rel"/><text x="700" y="104" class="lbl">1 — 0..1 user link</text>
  <path d="M280,300 L358,300" class="rel"/><text x="284" y="294" class="lbl">1 — *</text>
  <path d="M150,396 L150,458" class="rel"/><text x="156" y="430" class="lbl">1 — *</text>
  <path d="M835,396 L835,458" class="rel"/><text x="841" y="430" class="lbl">1 — *</text>
  <path d="M280,380 C500,440 600,500 708,520" class="rel"/><text x="560" y="492" class="lbl">1 — * assignments</text>
</svg>
